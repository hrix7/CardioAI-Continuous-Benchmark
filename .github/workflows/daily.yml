{
  "name": "Daily verified experiment",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {},
    "schedule": [
      {
        "cron": "37 9 * * *"
      }
    ]
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "experiment-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Test",
          "run": "python -m unittest discover -s tests -v"
        },
        {
          "name": "Generate and independently recompute artifacts",
          "run": "python pipeline.py\npython pipeline.py --verify"
        },
        {
          "name": "Run summary",
          "run": "cat results/report.md >> \"$GITHUB_STEP_SUMMARY\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "verified-results-${{ github.run_id }}",
            "path": "results/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    },
    "publish": {
      "needs": "validate",
      "if": "(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "${{ github.event.repository.default_branch }}",
            "persist-credentials": true
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "python -m unittest discover -s tests -v\npython pipeline.py\npython pipeline.py --verify"
        },
        {
          "name": "Commit only verified changed artifacts",
          "run": "git config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -- results/\nif ! git diff --cached --quiet; then\n  git commit -m \"Update verified synthetic experiment results\"\n  git push origin HEAD:\"$DEFAULT_BRANCH\"\nfi",
          "env": {
            "DEFAULT_BRANCH": "${{ github.event.repository.default_branch }}"
          }
        }
      ]
    }
  }
}
